name: doctors_doc
description: "A Doctors Appointment and Consultation App"
publish_to: 'none'
# Application version 
version: 0.2.1
# Flutter SDK version
environment:
  sdk: 3.8.0
# Application dependencies
dependencies:
  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  # dartz: to use Either
  dartz: ^0.10.1
  # to use Networking Services
  dio: ^5.8.0+1
  # to use Equatable
  equatable: ^2.0.7
  # to use Firebase
  firebase_core: ^3.14.0
  flutter:
    sdk: flutter
  # to use BLoC
  flutter_bloc: ^9.1.1
  # to use Flutter Intl
  flutter_localizations:
    sdk: flutter
  # to use Flutter Native Splash
  flutter_native_splash: ^2.4.6
  # to use Flutter ScreenUtil
  flutter_screenutil: ^5.9.3
  # to use Flutter SVG
  flutter_svg: ^2.1.0
  # to use Get It Dependency Injection
  get_it: ^8.0.3
  # to use Go Router
  go_router: ^15.1.2
  # to use Google Fonts
  google_fonts: ^6.2.1
  
  intl: ^0.20.2
  # to use Mockito to test mocks
  mockito: ^5.4.6
  
dev_dependencies:
  flutter_launcher_icons: "^0.14.3"
  # to run flutter pub run build_runner build
  build_runner: ^2.5.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icons.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/icons/
flutter_assets:
  assets_path: assets/images
  output_path: lib/config/images
  filename: images_path.dart
flutter_intl:
  enabled: true
